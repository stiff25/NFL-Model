<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1114">
<title>NFL Model V3</title>
<style>
:root{
  --bg:#0b1013;--bg2:#12191d;--card:#182125;--card2:#202b2f;
  --aqua:#00a7b5;--aqua2:#24c6d2;--aquaSoft:#123a40;
  --orange:#f5662b;--orangeSoft:#3a2119;
  --ink:#f5fbfc;--muted:#9aabb1;--line:#30454b;
  --green:#47d8a6;--red:#ff7a69;--shadow:0 12px 28px rgba(0,0,0,.28);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:radial-gradient(circle at 50% -20%,rgba(0,167,181,.14),transparent 42%),linear-gradient(180deg,#10171b 0,#0b1013 65%);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
button{font:inherit}
.wrap{max-width:820px;margin:auto;padding:14px 12px 42px}
header{position:relative;overflow:hidden;background:linear-gradient(145deg,#1b2529,#12181b);border:1px solid #315158;border-radius:24px;padding:20px 18px 17px;box-shadow:var(--shadow)}
header:after{content:"";position:absolute;left:0;right:0;bottom:0;height:6px;background:linear-gradient(90deg,var(--aqua) 0 72%,var(--orange) 72% 83%,var(--aqua) 83%)}
h1{margin:0 0 4px;font-size:29px;letter-spacing:-.6px}
.sub{font-size:15px;color:#b9dfe2}
.status{margin-top:16px;border:1px solid var(--aqua);color:#c5e7e9;background:rgba(0,167,181,.08);border-radius:16px;padding:12px 14px;font-size:14px;line-height:1.35}
.status.error{border-color:var(--red);background:rgba(255,122,105,.07);color:#ffd1ca}
.toprow{display:grid;grid-template-columns:1fr auto;gap:10px;margin-top:12px}
.refresh{width:100%;border:1px solid var(--aqua);background:linear-gradient(180deg,#13b1bd,#0796a4);color:#071114;font-weight:900;border-radius:17px;padding:14px 16px;box-shadow:0 10px 22px rgba(0,167,181,.18)}
.last{font-size:12px;color:var(--muted);text-align:right;align-self:center}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0;padding:8px 0;background:rgba(11,16,19,.92);backdrop-filter:blur(12px)}
.tab{border:1px solid #34464b;background:#202a2e;color:#d9e4e6;border-radius:15px;padding:11px 6px;font-weight:900;min-height:52px}
.tab.active{background:linear-gradient(180deg,#18b4bf,#079aa8);color:#061014;border-color:#27ccd6}
.section-title{font-size:19px;font-weight:900;margin:6px 2px 12px;color:#c3eff1}
.small{font-size:12px;color:var(--muted)}
.grid{display:grid;gap:12px}
.card{background:linear-gradient(145deg,#192327,#151c20);border:1px solid #315058;border-radius:20px;padding:15px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.card:before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:var(--aqua)}
.card.strong:before{background:linear-gradient(90deg,var(--aqua),var(--orange))}
.card.qual:before{background:linear-gradient(90deg,var(--aqua),#6acbd2)}
.card.upset:before{background:linear-gradient(90deg,var(--orange),var(--aqua))}
.gamehead{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.matchup{font-size:20px;font-weight:950;letter-spacing:.2px}
.date{font-size:12px;color:var(--muted);margin-top:2px}
.badge{border:1px solid #5b3025;background:var(--orangeSoft);color:#ff9b79;border-radius:11px;padding:7px 10px;font-size:12px;font-weight:950;white-space:nowrap}
.badge.aqua{border-color:#276970;background:var(--aquaSoft);color:#8fe9ee}
.pickbox{margin-top:13px;background:linear-gradient(135deg,#12373b,#1a3438);border:1px solid #2e7b82;border-radius:17px;padding:13px;display:flex;justify-content:space-between;gap:12px;align-items:center}
.label{font-size:12px;color:#a8b9be}
.pick{font-size:28px;font-weight:950;color:#23d0dc;line-height:1.08}
.conf{text-align:right}
.confv{font-size:26px;font-weight:950}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:11px}
.tile{background:#1d2a2e;border:1px solid #31535a;border-radius:14px;padding:11px}
.tv{font-size:18px;font-weight:900;margin-top:2px}
.action{display:inline-block;margin-top:11px;padding:8px 11px;border-radius:10px;font-size:12px;font-weight:950;border:1px solid #31545b;background:#162b30;color:#9deff1}
.action.warn{border-color:#6b3a2b;background:var(--orangeSoft);color:#ffad91}
.meta{margin-top:10px;color:var(--muted);font-size:12px;line-height:1.45}
.table{width:100%;border-collapse:collapse;font-size:12px}
.table th,.table td{padding:10px 8px;border-bottom:1px solid #29383d;text-align:left}
.table th{color:#9fdfe2;background:#16272b}
.pill{display:inline-block;border-radius:999px;padding:5px 8px;font-size:11px;font-weight:900}
.pill.strong{background:var(--orangeSoft);color:#ff9b79;border:1px solid #6a3c2c}
.pill.qual{background:var(--aquaSoft);color:#9deff1;border:1px solid #2f666d}
.pill.pass{background:#22292d;color:#9caeb3;border:1px solid #39484d}
.empty{padding:24px 16px;border:1px dashed #395159;border-radius:16px;color:var(--muted);background:#131b1f;text-align:center}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.kpi{background:linear-gradient(145deg,#19282c,#151d20);border:1px solid #31525a;border-radius:16px;padding:14px}
.kpi .v{font-size:25px;font-weight:950;color:#8cecf0}
.kpi .l{font-size:12px;color:var(--muted);margin-top:4px}
.note{margin-top:12px;padding:12px 14px;border-left:4px solid var(--orange);background:#1b211f;color:#c9d5d8;border-radius:10px;font-size:12px;line-height:1.45}
.hidden{display:none!important}
footer{padding:22px 4px 0;color:#677a80;font-size:11px;text-align:center}
@media (min-width:680px){.grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>NFL Model V3</h1>
  <div class="sub">Pick'em + ATS · Australian-region odds · Dolphins-inspired theme</div>
  <div id="status" class="status">Loading live feed…</div>
</header>

<div class="toprow">
  <button class="refresh" id="refreshBtn">Refresh now</button>
  <div class="last" id="lastUpdated"></div>
</div>

<nav class="tabs">
  <button class="tab active" data-tab="pickem">PICK'EM</button>
  <button class="tab" data-tab="ats">ATS</button>
  <button class="tab" data-tab="all">ALL<br>GAMES</button>
  <button class="tab" data-tab="record">RECORD</button>
</nav>

<section id="pickem">
  <div class="section-title" id="weekTitle">Current week · Pick'em</div>
  <div id="pickGrid" class="grid"></div>
</section>

<section id="ats" class="hidden">
  <div class="section-title">Current week · ATS</div>
  <div id="atsGrid" class="grid"></div>
</section>

<section id="all" class="hidden">
  <div class="section-title">All current-week games</div>
  <div id="allWrap"></div>
</section>

<section id="record" class="hidden">
  <div class="section-title">Model record & backtest</div>
  <div id="recordWrap"></div>
</section>

<footer>Live feed refreshes automatically every 10 minutes.</footer>
</div>

<script>
let rows=[];
const $=id=>document.getElementById(id);
const num=v=>Number.isFinite(Number(v))?Number(v):null;
const pct=v=>{const n=num(v);return n===null?'—':(n*100).toFixed(1)+'%'};
const pts=v=>{const n=num(v);return n===null?'—':(n>=0?'+':'')+n.toFixed(1)};
const ml=v=>{const n=num(v);return n===null?'—':(n>0?'+':'')+Math.round(n)};
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));

function norm(r){
  const hp=num(r.home_win_prob),ap=num(r.away_win_prob);
  const pick=hp!==null&&ap!==null?(hp>=ap?r.home_team:r.away_team):(r.pick_home===1?r.home_team:r.away_team);
  const conf=Math.max(hp??0,ap??0);
  const signal=String(r.signal_strength||'').toUpperCase();
  const upset=signal==='PASS'&&((ap??0)>0.45&&(ap??0)<0.57)&&pick===r.away_team;
  return {...r,pick,conf,signal,upset};
}
function tier(r){
  if(r.signal==='STRONG')return['STRONG','strong'];
  if(r.signal==='QUALIFIED')return['QUALIFIED','qual'];
  if(r.upset)return['UPSET WATCH','upset'];
  return['LEAN','pass'];
}
function gameDate(r){
  if(!r.gameday)return'';
  const d=new Date(r.gameday+'T12:00:00');
  return isNaN(d)?String(r.gameday):d.toLocaleDateString('en-AU',{weekday:'short',day:'numeric',month:'short'});
}
function pickCard(r){
  const [badge,bcls]=tier(r),homeProb=num(r.home_win_prob),awayProb=num(r.away_win_prob),edge=num(r.ml_edge);
  return `<article class="card ${bcls}">
    <div class="gamehead"><div><div class="matchup">${esc(r.away_team)} @ ${esc(r.home_team)}</div><div class="date">${gameDate(r)}</div></div><div class="badge ${bcls==='strong'?'':'aqua'}">${badge}</div></div>
    <div class="pickbox"><div><div class="label">BEST PICK'EM</div><div class="pick">${esc(r.pick)}</div></div><div class="conf"><div class="label">Confidence</div><div class="confv">${pct(r.conf)}</div></div></div>
    <div class="tiles">
      <div class="tile"><div class="label">Home win %</div><div class="tv">${pct(homeProb)}</div></div>
      <div class="tile"><div class="label">Projected margin</div><div class="tv">${pts(r.projected_margin)}</div></div>
      <div class="tile"><div class="label">Pick'em status</div><div class="tv">TAKE PICK</div></div>
      <div class="tile"><div class="label">Model votes</div><div class="tv">${esc(r.model_votes_home??'—')}/3</div></div>
    </div>
    <div class="action ${edge!==null&&Math.abs(edge)>=.035?'warn':''}">${edge!==null?'ML edge '+(edge>=0?'+':'')+(edge*100).toFixed(1)+'%':'ML market unavailable'}</div>
    <div class="meta">ML: ${esc(r.home_team)} ${ml(r.home_ml)} / ${esc(r.away_team)} ${ml(r.away_ml)} · Away win ${pct(awayProb)}</div>
  </article>`;
}
function atsCard(r){
  const spread=num(r.spread_home),edge=num(r.ats_edge_points_home),proj=num(r.projected_margin);
  let pick='—';
  if(spread!==null&&proj!==null)pick=proj+spread>=0?r.home_team:r.away_team;
  else if(r.ats_pick_home===1)pick=r.home_team;
  else if(r.ats_pick_home===0)pick=r.away_team;
  const strong=edge!==null&&Math.abs(edge)>=2.5,qual=edge!==null&&Math.abs(edge)>=1.5;
  return `<article class="card ${strong?'strong':qual?'qual':''}">
    <div class="gamehead"><div><div class="matchup">${esc(r.away_team)} @ ${esc(r.home_team)}</div><div class="date">${gameDate(r)}</div></div><div class="badge ${strong?'':'aqua'}">${strong?'STRONG':qual?'QUALIFIED':'LEAN'}</div></div>
    <div class="pickbox"><div><div class="label">ATS PICK</div><div class="pick">${esc(pick)}</div></div><div class="conf"><div class="label">Projected margin</div><div class="confv">${pts(proj)}</div></div></div>
    <div class="tiles"><div class="tile"><div class="label">Home spread</div><div class="tv">${spread===null?'—':(spread>=0?'+':'')+spread.toFixed(1)}</div></div><div class="tile"><div class="label">ATS edge</div><div class="tv">${pts(edge)}</div></div></div>
    <div class="action ${strong||qual?'warn':''}">${esc(r.ats_action||'LEAN ATS')}</div>
  </article>`;
}
function render(){
  const clean=rows.map(norm).sort((a,b)=>String(a.gameday||'').localeCompare(String(b.gameday||'')));
  const weeks=[...new Set(clean.map(r=>r.week).filter(v=>v!==null&&v!==undefined))];
  const weekTitle=weeks.length===1?'Week '+weeks[0]:'Current week';
  $('weekTitle').textContent=weekTitle+" · Pick'em";
  $('pickGrid').innerHTML=clean.length?clean.map(pickCard).join(''):'<div class="empty">No games in the live feed.</div>';
  $('atsGrid').innerHTML=clean.length?clean.map(atsCard).join(''):'<div class="empty">No games in the live feed.</div>';
  $('allWrap').innerHTML=clean.length?`<div style="overflow:auto"><table class="table"><thead><tr><th>Game</th><th>Pick</th><th>Conf.</th><th>Status</th><th>Spread</th></tr></thead><tbody>${clean.map(r=>{const[t,c]=tier(r),s=num(r.spread_home);return`<tr><td>${esc(r.away_team)} @ ${esc(r.home_team)}<br><span class="small">${gameDate(r)}</span></td><td><b>${esc(r.pick)}</b></td><td>${pct(r.conf)}</td><td><span class="pill ${c}">${t}</span></td><td>${s===null?'—':(s>=0?'+':'')+s.toFixed(1)}</td></tr>`}).join('')}</tbody></table></div>`:'<div class="empty">No games in the live feed.</div>';
  const strong=clean.filter(r=>r.signal==='STRONG').length,qual=clean.filter(r=>r.signal==='QUALIFIED').length,lean=clean.length-strong-qual;
  const avg=clean.length?clean.reduce((s,r)=>s+r.conf,0)/clean.length:null;
  $('recordWrap').innerHTML=`<div class="kpis">
    <div class="kpi"><div class="v">${clean.length}</div><div class="l">Games this week</div></div>
    <div class="kpi"><div class="v">${pct(avg)}</div><div class="l">Average confidence</div></div>
    <div class="kpi"><div class="v">${strong}</div><div class="l">Strong picks</div></div>
    <div class="kpi"><div class="v">${qual}</div><div class="l">Qualified picks</div></div>
  </div>
  <div class="note">Every game receives a Pick'em selection. Strong and Qualified labels are confidence tiers, not guarantees.</div>
  <div class="small" style="margin-top:12px">Lower-confidence selections: ${lean}</div>`;
}
async function loadFeed(){
  try{
    const res=await fetch('./data/current_picks.json?v='+Date.now(),{cache:'no-store'});
    if(!res.ok)throw new Error('Feed HTTP '+res.status);
    const data=await res.json();
    if(!Array.isArray(data))throw new Error('Feed format is not an array');
    rows=data;
    const weeks=[...new Set(data.map(x=>x.week).filter(v=>v!==null&&v!==undefined))];
    const wt=weeks.length===1?'Week '+weeks[0]:'Current week';
    $('status').classList.remove('error');
    $('status').textContent=`V3 live feed · ${data.length} games · ${wt} · updated ${new Date().toLocaleString('en-AU')}`;
    $('lastUpdated').textContent='Live data';
    render();
  }catch(e){
    console.error(e);
    $('status').classList.add('error');
    $('status').textContent='Live feed error: '+e.message;
    $('pickGrid').innerHTML='<div class="empty">The live model feed could not be loaded. Tap Refresh now.</div>';
  }
}
document.querySelectorAll('.tab').forEach(btn=>btn.addEventListener('click',()=>{
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  const target=btn.dataset.tab;
  ['pickem','ats','all','record'].forEach(id=>$(id).classList.toggle('hidden',id!==target));
}));
$('refreshBtn').addEventListener('click',loadFeed);
loadFeed();
setInterval(loadFeed,600000);
</script>
</body>
</html>
