name: Update NFL Model

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */3 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install numpy pandas scikit-learn pyarrow requests

      - name: Run V3 model
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_REGIONS: au
          ODDS_MARKETS: h2h,spreads,totals
        run: python nfl_model_v3.py

      - name: Convert picks to valid JSON
        run: |
          python - <<'PY'
          import json, math
          from pathlib import Path
          import pandas as pd

          src = Path("nfl_model_v3_current_picks.csv")
          dst = Path("data/current_picks.json")
          dst.parent.mkdir(parents=True, exist_ok=True)

          df = pd.read_csv(src)

          def clean(v):
              if isinstance(v, dict):
                  return {k: clean(x) for k, x in v.items()}
              if isinstance(v, list):
                  return [clean(x) for x in v]
              if isinstance(v, float) and not math.isfinite(v):
                  return None
              return v

          payload = clean(df.to_dict(orient="records"))

          with dst.open("w", encoding="utf-8") as f:
              json.dump(payload, f, indent=2, allow_nan=False)

          print(f"Wrote valid JSON: {dst} ({len(payload)} games)")
          PY

      - name: Commit updated feed
        run: |
          git config user.name "NFL Model Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/current_picks.json
          git diff --cached --quiet || git commit -m "Update NFL model feed"
          git push
